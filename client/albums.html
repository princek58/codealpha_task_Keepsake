<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F3EC">
  <title>Albums — Keepsake</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <style>
    .albums-page-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: var(--space-md) var(--space-sm) var(--space-3xl);
    }
    .albums-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
      flex-wrap: wrap;
    }
    .albums-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--space-lg);
    }
    .album-card {
      background-color: var(--color-white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-sand);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
      cursor: pointer;
    }
    .album-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .album-cover-wrap {
      position: relative;
      aspect-ratio: 4/3;
      background-color: var(--color-sand);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .album-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .album-body {
      padding: var(--space-md);
      flex: 1;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body class="paper-grain" style="min-height: 100vh; display: flex; flex-direction: column;">
  <div id="shell-mount"></div>

  <main id="main-content" style="flex: 1;" class="page-container">
    <div class="albums-page-container">
      <header class="albums-header">
        <div>
          <h1 style="font-size: var(--text-2xl); font-weight: 600; margin-bottom: 4px;">Curated Albums</h1>
          <p class="text-muted" style="font-size: var(--text-sm);">Handpicked collections of your cherished memories and photos.</p>
        </div>
        <div>
          <button id="btn-create-album" class="btn btn-primary" aria-label="Create album">
            + New Album
          </button>
        </div>
      </header>

      <!-- Skeleton loader -->
      <div id="albums-skeleton" class="albums-grid">
        <div class="card" style="aspect-ratio: 4/3; border-radius: var(--radius-lg);"><div class="skeleton" style="width: 100%; height: 100%;"></div></div>
        <div class="card" style="aspect-ratio: 4/3; border-radius: var(--radius-lg);"><div class="skeleton" style="width: 100%; height: 100%;"></div></div>
        <div class="card" style="aspect-ratio: 4/3; border-radius: var(--radius-lg);"><div class="skeleton" style="width: 100%; height: 100%;"></div></div>
      </div>

      <!-- Empty state -->
      <div id="albums-empty" class="empty-state" style="display: none; padding: var(--space-3xl) var(--space-lg); background-color: var(--color-white); border-radius: var(--radius-lg); border: 1px solid var(--color-sand);">
        <img src="/assets/stickers/bookmark.svg" width="72" height="72" alt="No albums" style="margin-bottom: var(--space-md);">
        <h2 style="margin-bottom: var(--space-xs);">No albums yet</h2>
        <p class="text-muted" style="margin-bottom: var(--space-lg); max-width: 420px;">
          Create an album to organize special events, travels, or personal stories into beautiful collections.
        </p>
        <button id="btn-empty-new-album" class="btn btn-primary">Create Your First Album</button>
      </div>

      <!-- Albums Grid -->
      <div id="albums-grid" class="albums-grid" style="display: none;"></div>
    </div>
  </main>

  <!-- Create Album Modal -->
  <div id="modal-create-album" class="modal-backdrop">
    <div class="modal" role="dialog" aria-labelledby="create-album-title" aria-modal="true" style="padding: var(--space-xl);">
      <h2 id="create-album-title" style="font-size: var(--text-xl); font-weight: 600; margin-bottom: var(--space-md);">Create Album</h2>
      <form id="form-create-album">
        <div class="form-group" style="margin-bottom: var(--space-md);">
          <label for="new-album-title" class="label" style="font-size: var(--text-xs); font-weight: 600; display: block; margin-bottom: 4px;">Album Title *</label>
          <input type="text" id="new-album-title" class="input" required maxlength="80" placeholder="e.g. Summer in Kyoto" style="width: 100%;">
        </div>
        <div class="form-group" style="margin-bottom: var(--space-md);">
          <label for="new-album-desc" class="label" style="font-size: var(--text-xs); font-weight: 600; display: block; margin-bottom: 4px;">Description</label>
          <textarea id="new-album-desc" class="input" rows="3" maxlength="500" placeholder="A few words about this collection..." style="width: 100%; resize: vertical;"></textarea>
        </div>
        <div class="form-group" style="margin-bottom: var(--space-lg);">
          <label for="new-album-vis" class="label" style="font-size: var(--text-xs); font-weight: 600; display: block; margin-bottom: 4px;">Visibility</label>
          <select id="new-album-vis" class="input" style="width: 100%;">
            <option value="private" selected>Private (Only you)</option>
            <option value="followers">Followers only</option>
            <option value="public">Public</option>
          </select>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: var(--space-sm);">
          <button type="button" id="btn-cancel-create" class="btn btn-sand">Cancel</button>
          <button type="submit" id="btn-submit-create" class="btn btn-primary">Create Album</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/pages/albums.js"></script>
</body>
</html>
