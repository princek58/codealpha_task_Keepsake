<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Bloomly</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">

  <script type="module">
    import { getStickerSvg } from '/js/stickers.js';
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-sticker]').forEach((el) => {
        el.innerHTML = getStickerSvg(el.getAttribute('data-sticker'), { size: 96 });
      });
    });
  </script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: var(--space-6);">

  <div class="card" style="max-width: 480px; width: 100%; padding: var(--space-10) var(--space-6);">
    <div style="width: 96px; height: 96px; margin: 0 auto var(--space-4);" data-sticker="cloud"></div>

    <span class="badge badge-mint" style="margin-bottom: var(--space-3);">404 Error</span>
    <h1 style="font-family: var(--font-heading); font-size: var(--text-3xl); color: var(--color-text); margin: 0 0 var(--space-2);">
      Lost in the Garden
    </h1>

    <p style="font-family: var(--font-accent); font-size: var(--text-2xl); color: var(--color-primary-strong); margin: 0 0 var(--space-4);">
      Even little sprouts sometimes lose their path...
    </p>

    <p style="font-size: var(--text-sm); color: var(--color-text-muted); line-height: 1.6; margin: 0 0 var(--space-6);">
      The moment you are looking for may have been moved, pruned, or does not exist yet in our garden.
    </p>

    <div style="display: flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap;">
      <a href="/feed.html" class="btn btn-primary">Return to Feed</a>
      <a href="/explore.html" class="btn btn-secondary">Explore Garden</a>
    </div>
  </div>

</body>
</html>
