<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F3EC">
  <title>Moment — Keepsake</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <style>
    .moment-page-container {
      max-width: 760px;
      margin: 0 auto;
      padding: var(--space-md) var(--space-sm) var(--space-3xl);
    }
    .moment-card-full {
      background-color: var(--color-white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-sand);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .moment-author-header {
      padding: var(--space-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--color-sand);
    }
    .moment-meta-body {
      padding: var(--space-lg);
    }
    .moment-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: var(--space-sm) 0;
    }
    .comments-section {
      margin-top: var(--space-xl);
      background-color: var(--color-white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-sand);
      box-shadow: var(--shadow-sm);
      padding: var(--space-lg);
    }
    .comment-item {
      display: flex;
      gap: var(--space-sm);
      padding: var(--space-sm) 0;
      border-bottom: 1px solid var(--color-sand);
    }
    .comment-item:last-child {
      border-bottom: none;
    }
    .comment-composer-wrap {
      display: flex;
      gap: var(--space-sm);
      margin-top: var(--space-md);
      align-items: flex-start;
    }
  </style>
</head>
<body class="paper-grain" style="min-height: 100vh; display: flex; flex-direction: column;">
  <div id="shell-mount"></div>

  <main id="main-content" style="flex: 1;" class="page-container">
    <div class="moment-page-container">
      <div style="margin-bottom: var(--space-md); display: flex; justify-content: space-between; align-items: center;">
        <button id="btn-back-nav" class="btn btn-sand btn-sm" aria-label="Go back">
          &larr; Back
        </button>
        <div id="moment-top-actions"></div>
      </div>

      <!-- Loading skeleton -->
      <div id="moment-skeleton" class="moment-card-full" style="padding: var(--space-lg);">
        <div style="display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-md);">
          <div class="skeleton" style="width: 44px; height: 44px; border-radius: var(--radius-full);"></div>
          <div style="flex: 1;">
            <div class="skeleton" style="width: 140px; height: 16px; margin-bottom: 6px; border-radius: 4px;"></div>
            <div class="skeleton" style="width: 80px; height: 12px; border-radius: 4px;"></div>
          </div>
        </div>
        <div class="skeleton" style="width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-md); margin-bottom: var(--space-md);"></div>
        <div class="skeleton" style="width: 60%; height: 24px; margin-bottom: var(--space-sm); border-radius: 4px;"></div>
        <div class="skeleton" style="width: 90%; height: 14px; border-radius: 4px;"></div>
      </div>

      <!-- Error / 404 state -->
      <div id="moment-error" class="empty-state" style="display: none; padding: var(--space-3xl) var(--space-lg); background-color: var(--color-white); border-radius: var(--radius-lg); border: 1px solid var(--color-sand);">
        <img src="/assets/stickers/camera.svg" width="64" height="64" alt="Not found" style="margin-bottom: var(--space-md);">
        <h2 id="moment-error-title" style="margin-bottom: var(--space-xs);">Moment Not Found</h2>
        <p id="moment-error-desc" class="text-muted" style="margin-bottom: var(--space-lg);">This moment may be private, deleted, or the link is incorrect.</p>
        <a href="/home.html" class="btn btn-primary">Return to Home</a>
      </div>

      <!-- Moment Full View -->
      <article id="moment-article" class="moment-card-full" style="display: none;">
        <header class="moment-author-header">
          <div id="author-wrap" style="display: flex; align-items: center; gap: var(--space-sm);"></div>
          <div id="author-actions" style="display: flex; align-items: center; gap: var(--space-xs);"></div>
        </header>

        <!-- Media Display Area -->
        <div id="moment-media-mount" style="background-color: var(--color-sand); min-height: 240px; position: relative;"></div>

        <!-- Meta Details Area -->
        <div class="moment-meta-body">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-sm);">
            <div id="moment-date-place" style="font-size: var(--text-xs); color: var(--color-stone); display: flex; align-items: center; gap: var(--space-xs);"></div>
            <div id="moment-badge-wrap"></div>
          </div>

          <h1 id="moment-title" style="font-size: var(--text-2xl); font-weight: 600; margin-bottom: var(--space-xs); line-height: 1.3;"></h1>
          
          <div id="moment-caption" style="font-size: var(--text-base); line-height: 1.6; color: var(--color-ink); margin-bottom: var(--space-md); white-space: pre-wrap;"></div>

          <div id="moment-tags" class="moment-meta-tags"></div>

          <!-- Interaction Row -->
          <div style="display: flex; align-items: center; justify-content: space-between; padding-top: var(--space-md); border-top: 1px solid var(--color-sand); margin-top: var(--space-md);">
            <div style="display: flex; align-items: center; gap: var(--space-md);">
              <button id="btn-like" class="btn btn-ghost" style="padding: 6px 12px; gap: 6px;" aria-label="Like moment">
                <span id="like-icon-wrap" style="display: inline-flex;"></span>
                <span id="like-count" style="font-weight: 600; font-size: var(--text-sm);">0</span>
              </button>

              <a href="#comments" class="btn btn-ghost" style="padding: 6px 12px; gap: 6px; text-decoration: none; color: inherit;" aria-label="View comments">
                <span id="comment-icon-wrap" style="display: inline-flex;"></span>
                <span id="comment-count-badge" style="font-weight: 600; font-size: var(--text-sm);">0</span>
              </a>
            </div>

            <div>
              <button id="btn-share" class="btn btn-ghost btn-sm" aria-label="Share moment">
                <span id="share-icon-wrap" style="display: inline-flex;"></span>
                <span>Share</span>
              </button>
            </div>
          </div>
        </div>
      </article>

      <!-- Comments Section -->
      <section id="comments" class="comments-section" style="display: none;">
        <h2 style="font-size: var(--text-lg); margin-bottom: var(--space-md); font-weight: 600;">
          Comments (<span id="comments-header-count">0</span>)
        </h2>

        <!-- Comment Composer -->
        <form id="comment-form" action="javascript:void(0);" style="margin-bottom: var(--space-xl);">
          <div class="comment-composer-wrap">
            <div id="composer-avatar-mount"></div>
            <div style="flex: 1;">
              <textarea id="comment-input" class="input" rows="2" maxlength="300" placeholder="Leave a kind word or memory..." style="resize: vertical; width: 100%; font-family: inherit; font-size: var(--text-sm); padding: var(--space-sm);"></textarea>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
                <span style="font-size: 11px; color: var(--color-stone);">Press Enter to post, Shift+Enter for new line</span>
                <div style="display: flex; align-items: center; gap: var(--space-sm);">
                  <span id="comment-char-count" style="font-size: 11px; color: var(--color-stone);">0/300</span>
                  <button type="submit" id="btn-post-comment" class="btn btn-primary btn-sm" disabled>Post</button>
                </div>
              </div>
            </div>
          </div>
        </form>

        <!-- Comments List -->
        <div id="comments-list" style="display: flex; flex-direction: column;"></div>

        <!-- Comments empty state -->
        <div id="comments-empty" style="display: none; text-align: center; padding: var(--space-xl) var(--space-md); color: var(--color-stone); font-size: var(--text-sm);">
          No comments yet. Be the first to leave a thought.
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/js/pages/moment.js"></script>
</body>
</html>
