<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Feed — Bloomly</title>
  <meta name="description" content="Chronological moments from your garden friends on Bloomly.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">

  <style>
    .feed-layout {
      max-width: 1040px;
      margin: 0 auto;
      padding: var(--space-6) var(--space-4) var(--space-20);
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: var(--space-8);
      align-items: flex-start;
    }
    .feed-main {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
      min-width: 0;
    }
    .feed-sidebar {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
      position: sticky;
      top: 90px;
    }
    @media (max-width: 860px) {
      .feed-layout {
        grid-template-columns: 1fr;
      }
      .feed-sidebar {
        position: static;
      }
    }
    .bloom-bounce {
      animation: bloomDropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes bloomDropIn {
      0% { opacity: 0; transform: translateY(-24px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .load-more-sentinel {
      padding: var(--space-4);
      text-align: center;
      min-height: 40px;
    }
  </style>

  <script type="module">
    import { api } from '/js/api.js';
    import { initApp } from '/js/app.js';
    import { getStickerSvg } from '/js/stickers.js';
    import { toast, openModal, closeModal, createAvatar, buildPostCard, buildUserRow, createSkeletonPost, buildEmptyState } from '/js/ui.js';
    import { createHeartBurst } from '/js/animations.js';

    let currentUser = null;
    let currentPage = 1;
    let hasMore = true;
    let isLoading = false;
    let observer = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await initApp({
        activeTab: 'feed',
        protectedPage: true,
        onReady: (user) => {
          currentUser = user;
          initFeed();
        }
      });
    });

    function initFeed() {
      setupComposer();
      setupStatsSidebar();
      setupSuggestedSidebar();
      loadFeedPosts(1, true);

      // Register hook for navbar New Bloom modal
      window.onNewPostCreated = (newPost) => {
        prependPostToFeed(newPost);
      };
    }

    // 1. Composer card logic
    function setupComposer() {
      const avSlot = document.getElementById('composer-avatar-slot');
      if (avSlot && currentUser) {
        avSlot.appendChild(
          createAvatar({
            avatar: currentUser.avatar,
            displayName: currentUser.displayName || currentUser.username,
            moodSticker: currentUser.moodSticker,
            size: 'md'
          })
        );
      }

      const textarea = document.getElementById('composer-text');
      const counter = document.getElementById('composer-counter');
      const fileInput = document.getElementById('composer-file');
      const previewWrap = document.getElementById('composer-preview-wrap');
      const previewImg = document.getElementById('composer-preview-img');
      const removeBtn = document.getElementById('composer-preview-remove');
      const submitBtn = document.getElementById('composer-submit');

      let selectedFile = null;

      textarea.addEventListener('input', () => {
        const len = textarea.value.length;
        counter.textContent = `${len} / 500`;
        counter.classList.toggle('warning', len >= 480);
      });

      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
          toast('Photo must be under 2MB', 'error');
          fileInput.value = '';
          return;
        }

        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImg.src = e.target.result;
          previewWrap.style.display = 'block';
        };
        reader.readAsDataURL(file);
      });

      removeBtn.addEventListener('click', () => {
        selectedFile = null;
        fileInput.value = '';
        previewImg.src = '';
        previewWrap.style.display = 'none';
      });

      submitBtn.addEventListener('click', async () => {
        const text = textarea.value.trim();
        if (!text && !selectedFile) {
          toast('Share a thought or photo to bloom', 'error');
          return;
        }

        submitBtn.classList.add('btn-loading');
        submitBtn.disabled = true;

        try {
          const formData = new FormData();
          if (text) formData.append('text', text);
          if (selectedFile) formData.append('image', selectedFile);

          const res = await api.createPost(formData);

          // Reset composer
          textarea.value = '';
          counter.textContent = '0 / 500';
          counter.classList.remove('warning');
          selectedFile = null;
          fileInput.value = '';
          previewImg.src = '';
          previewWrap.style.display = 'none';

          const rect = submitBtn.getBoundingClientRect();
          createHeartBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 10);
          toast('Your bloom was planted in the garden!', 'success');

          prependPostToFeed(res.post);

          // Increment user post count in stats
          incrementStatsBlooms();
        } catch (err) {
          toast(err.message || 'Failed to plant bloom', 'error');
        } finally {
          submitBtn.classList.remove('btn-loading');
          submitBtn.disabled = false;
        }
      });
    }

    function prependPostToFeed(post) {
      const container = document.getElementById('feed-posts');
      const emptyState = document.getElementById('feed-empty-state');
      if (emptyState) emptyState.remove();

      const card = createPostElement(post);
      card.classList.add('bloom-bounce');
      container.prepend(card);
    }

    // 2. Load feed posts with infinite scroll
    async function loadFeedPosts(page = 1, isInitial = false) {
      if (isLoading) return;
      isLoading = true;

      const skeletonBox = document.getElementById('feed-skeletons');
      const container = document.getElementById('feed-posts');
      const sentinel = document.getElementById('load-more-sentinel');
      const loadMoreBtn = document.getElementById('load-more-btn');

      if (isInitial) {
        skeletonBox.style.display = 'flex';
        skeletonBox.innerHTML = '';
        skeletonBox.appendChild(createSkeletonPost());
        skeletonBox.appendChild(createSkeletonPost());
      }

      try {
        const res = await api.getFeed(page, 10);
        const posts = res.items || [];
        hasMore = res.hasMore;
        currentPage = page;

        skeletonBox.style.display = 'none';

        if (isInitial && posts.length === 0) {
          renderEmptyFeed();
          return;
        }

        posts.forEach((post) => {
          // Avoid duplicate cards
          if (!container.querySelector(`[data-id="${post.id}"]`)) {
            const card = createPostElement(post);
            container.appendChild(card);
          }
        });

        if (hasMore) {
          setupInfiniteObserver();
          if (loadMoreBtn) loadMoreBtn.style.display = 'inline-flex';
        } else {
          if (observer) observer.disconnect();
          if (loadMoreBtn) loadMoreBtn.style.display = 'none';
          if (posts.length > 0 && !document.getElementById('all-caught-up')) {
            const endMsg = document.createElement('div');
            endMsg.id = 'all-caught-up';
            endMsg.style.textAlign = 'center';
            endMsg.style.padding = 'var(--space-8) var(--space-4)';
            endMsg.style.color = 'var(--color-text-muted)';
            endMsg.style.fontSize = 'var(--text-sm)';
            endMsg.innerHTML = `
              <div style="width: 44px; height: 44px; margin: 0 auto var(--space-2);">${getStickerSvg('flower', { size: 44 })}</div>
              <div>You are all caught up in the garden!</div>
            `;
            container.appendChild(endMsg);
          }
        }
      } catch (err) {
        skeletonBox.style.display = 'none';
        if (isInitial) {
          container.innerHTML = `
            <div class="empty-state" style="border-color: var(--color-danger);">
              <div style="width: 56px; height: 56px; margin-bottom: var(--space-3);">${getStickerSvg('cloud', { size: 56 })}</div>
              <h3 class="empty-state-title">Could not load feed</h3>
              <p class="empty-state-desc">${err.message || 'Please check your connection and try again.'}</p>
              <button class="btn btn-secondary" id="retry-feed-btn">Retry</button>
            </div>
          `;
          document.getElementById('retry-feed-btn')?.addEventListener('click', () => loadFeedPosts(1, true));
        } else {
          toast('Failed to load older blooms', 'error');
        }
      } finally {
        isLoading = false;
      }
    }

    function setupInfiniteObserver() {
      if (observer) observer.disconnect();
      const sentinel = document.getElementById('load-more-sentinel');
      if (!sentinel) return;

      observer = new IntersectionObserver(
        (entries) => {
          if (entries[0].isIntersecting && hasMore && !isLoading) {
            loadFeedPosts(currentPage + 1, false);
          }
        },
        { rootMargin: '200px' }
      );
      observer.observe(sentinel);

      const loadMoreBtn = document.getElementById('load-more-btn');
      if (loadMoreBtn) {
        loadMoreBtn.onclick = () => {
          if (hasMore && !isLoading) loadFeedPosts(currentPage + 1, false);
        };
      }
    }

    function createPostElement(post) {
      return buildPostCard(post, {
        onLike: async (p, btn, e) => {
          const heartSvg = btn.querySelector('svg');
          const countEl = btn.querySelector('.like-count');
          const isLiked = btn.classList.toggle('active');
          const currentCount = parseInt(countEl.textContent, 10) || 0;
          const nextCount = isLiked ? currentCount + 1 : Math.max(0, currentCount - 1);
          countEl.textContent = String(nextCount);

          if (isLiked) {
            const rect = btn.getBoundingClientRect();
            createHeartBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 8);
          }

          try {
            const res = await api.toggleLike(p.id);
            countEl.textContent = String(res.likesCount);
            btn.classList.toggle('active', res.liked);
          } catch (err) {
            // Roll back
            btn.classList.toggle('active', !isLiked);
            countEl.textContent = String(currentCount);
            toast(err.message || 'Could not update heart', 'error');
          }
        },
        onDelete: async (p, cardEl) => {
          try {
            await api.deletePost(p.id);
            cardEl.style.transition = 'all 0.3s ease';
            cardEl.style.opacity = '0';
            cardEl.style.transform = 'scale(0.9)';
            setTimeout(() => cardEl.remove(), 300);
            toast('Bloom pruned safely', 'info');
            decrementStatsBlooms();
          } catch (err) {
            toast(err.message || 'Could not delete bloom', 'error');
          }
        }
      });
    }

    function renderEmptyFeed() {
      const container = document.getElementById('feed-posts');
      const box = buildEmptyState({
        title: 'Your garden feed is resting quietly',
        subtitle: 'Plant a moment above, or follow other gardeners to watch their blooms unfold in chronological order.',
        stickerName: 'sprout',
        actionText: 'Explore Gardeners',
        actionHref: '/explore.html'
      });
      box.id = 'feed-empty-state';
      container.appendChild(box);
    }

    // 3. User stats sidebar
    function setupStatsSidebar() {
      if (!currentUser) return;
      const slot = document.getElementById('sidebar-user-slot');
      if (!slot) return;

      slot.innerHTML = `
        <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4);">
          <div id="stats-avatar-slot"></div>
          <div>
            <a href="/profile.html?u=${encodeURIComponent(currentUser.username)}" style="font-family: var(--font-heading); font-size: var(--text-base); font-weight: 700; color: var(--color-text); text-decoration: none; display: block;">
              ${escapeText(currentUser.displayName || currentUser.username)}
            </a>
            <span style="font-size: var(--text-xs); color: var(--color-text-muted);">@${currentUser.username}</span>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: var(--space-2); padding: var(--space-3) 0; border-top: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border);">
          <div>
            <div style="font-family: var(--font-heading); font-size: var(--text-lg); font-weight: 700; color: var(--color-primary-strong);" id="stats-blooms-count">${currentUser.postsCount || 0}</div>
            <div style="font-size: var(--text-xs); color: var(--color-text-muted);">Blooms</div>
          </div>
          <div>
            <div style="font-family: var(--font-heading); font-size: var(--text-lg); font-weight: 700; color: var(--color-text);" id="stats-followers-count">${currentUser.followersCount || 0}</div>
            <div style="font-size: var(--text-xs); color: var(--color-text-muted);">Garden</div>
          </div>
          <div>
            <div style="font-family: var(--font-heading); font-size: var(--text-lg); font-weight: 700; color: var(--color-text);" id="stats-following-count">${currentUser.followingCount || 0}</div>
            <div style="font-size: var(--text-xs); color: var(--color-text-muted);">Planted</div>
          </div>
        </div>
      `;

      const av = slot.querySelector('#stats-avatar-slot');
      av.appendChild(
        createAvatar({
          avatar: currentUser.avatar,
          displayName: currentUser.displayName || currentUser.username,
          moodSticker: currentUser.moodSticker,
          size: 'md'
        })
      );
    }

    function incrementStatsBlooms() {
      const el = document.getElementById('stats-blooms-count');
      if (el) el.textContent = String((parseInt(el.textContent, 10) || 0) + 1);
    }

    function decrementStatsBlooms() {
      const el = document.getElementById('stats-blooms-count');
      if (el) el.textContent = String(Math.max(0, (parseInt(el.textContent, 10) || 1) - 1));
    }

    // 4. Suggested Gardeners sidebar
    async function setupSuggestedSidebar() {
      const slot = document.getElementById('suggested-gardeners-slot');
      if (!slot) return;

      try {
        const res = await api.getSuggestions();
        const users = res.items || [];
        slot.innerHTML = '';

        if (!users.length) {
          slot.innerHTML = `<div style="font-size: var(--text-xs); color: var(--color-text-light); text-align: center; padding: var(--space-4);">No new gardeners to suggest</div>`;
          return;
        }

        users.slice(0, 5).forEach((u) => {
          const row = buildUserRow(u, {
            onFollow: async (user, btn) => {
              const textSpan = btn.querySelector('.follow-text');
              const iconSlot = btn.querySelector('.btn-icon-slot');
              const isPlanted = textSpan.textContent === 'Planted';

              // Optimistic UI
              textSpan.textContent = isPlanted ? 'Plant' : 'Planted';
              btn.className = `btn btn-sm ${isPlanted ? 'btn-primary' : 'btn-secondary'}`;
              iconSlot.innerHTML = getStickerSvg(isPlanted ? 'sprout' : 'flower', { size: 14 });

              if (!isPlanted) {
                const rect = btn.getBoundingClientRect();
                createHeartBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 6);
              }

              try {
                const followRes = await api.toggleFollow(user.id);
                textSpan.textContent = followRes.following ? 'Planted' : 'Plant';
                btn.className = `btn btn-sm ${followRes.following ? 'btn-secondary' : 'btn-primary'}`;
                iconSlot.innerHTML = getStickerSvg(followRes.following ? 'flower' : 'sprout', { size: 14 });

                // Update planted count in sidebar
                const statsFollow = document.getElementById('stats-following-count');
                if (statsFollow) {
                  const cur = parseInt(statsFollow.textContent, 10) || 0;
                  statsFollow.textContent = String(followRes.following ? cur + 1 : Math.max(0, cur - 1));
                }
              } catch (err) {
                // Roll back
                textSpan.textContent = isPlanted ? 'Planted' : 'Plant';
                btn.className = `btn btn-sm ${isPlanted ? 'btn-secondary' : 'btn-primary'}`;
                iconSlot.innerHTML = getStickerSvg(isPlanted ? 'flower' : 'sprout', { size: 14 });
                toast(err.message || 'Could not update connection', 'error');
              }
            }
          });
          slot.appendChild(row);
        });
      } catch {
        slot.innerHTML = `<div style="font-size: var(--text-xs); color: var(--color-text-light); text-align: center; padding: var(--space-4);">Could not load suggestions</div>`;
      }
    }

    function escapeText(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</head>
<body>

  <main id="main-content" class="feed-layout">
    <!-- Left Main Column: Composer + Posts Feed -->
    <div class="feed-main">
      <!-- Live Post Composer Card -->
      <section class="composer-card" aria-label="Compose a new bloom">
        <div class="composer-row">
          <div id="composer-avatar-slot"></div>
          <div style="flex: 1;">
            <label for="composer-text" class="sr-only" style="display: none;">Compose moment text</label>
            <textarea id="composer-text" class="composer-textarea" placeholder="What is blooming in your day today?" maxlength="500"></textarea>
          </div>
        </div>

        <!-- Attached Photo Preview Box -->
        <div id="composer-preview-wrap" class="composer-preview-wrap" style="display: none;">
          <img id="composer-preview-img" src="" alt="Moment image preview">
          <button type="button" class="composer-preview-remove" id="composer-preview-remove" aria-label="Remove image">×</button>
        </div>

        <div class="composer-footer">
          <div class="composer-actions">
            <label class="btn-icon" style="cursor: pointer; width: 38px; height: 38px;" title="Attach photo (Max 2MB)">
              <input type="file" id="composer-file" accept="image/png,image/jpeg,image/webp,image/gif" style="display: none;">
              <span style="width: 20px; height: 20px; display: inline-flex;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                  <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
              </span>
            </label>
            <span class="composer-counter" id="composer-counter">0 / 500</span>
          </div>

          <button type="button" class="btn btn-primary" id="composer-submit">
            <span>Bloom</span>
            <span style="width: 16px; height: 16px; display: inline-flex;">
              <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-4H8l4-5 4 5h-3v4z"></path>
              </svg>
            </span>
          </button>
        </div>
      </section>

      <!-- Skeleton Loaders -->
      <div id="feed-skeletons" style="display: flex; flex-direction: column; gap: var(--space-6);"></div>

      <!-- Feed Posts Container -->
      <section id="feed-posts" aria-label="Feed blooms" style="display: flex; flex-direction: column; gap: var(--space-6);"></section>

      <!-- Infinite Scroll Sentinel & Fallback Button -->
      <div id="load-more-sentinel" class="load-more-sentinel">
        <button type="button" class="btn btn-secondary btn-sm" id="load-more-btn" style="display: none;">
          Load more blooms
        </button>
      </div>
    </div>

    <!-- Right Sidebar Column (Desktop) -->
    <aside class="feed-sidebar" aria-label="Garden sidebar">
      <!-- Your Garden Stats Card -->
      <div class="card" id="sidebar-user-slot" style="padding: var(--space-5);"></div>

      <!-- Suggested Gardeners Card -->
      <div class="card" style="padding: var(--space-5);">
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--space-4);">
          <h3 style="font-family: var(--font-heading); font-size: var(--text-base); color: var(--color-text); margin: 0;">
            Suggested Gardeners
          </h3>
          <a href="/explore.html" style="font-size: var(--text-xs); color: var(--color-primary-strong); text-decoration: none; font-family: var(--font-heading);">
            Explore all
          </a>
        </div>
        <div id="suggested-gardeners-slot" style="display: flex; flex-direction: column; gap: var(--space-3);"></div>
      </div>
    </aside>
  </main>

</body>
</html>
