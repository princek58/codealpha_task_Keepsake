<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garden Profile — Bloomly</title>
  <meta name="description" content="Gardener profile on Bloomly.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">

  <style>
    .profile-layout {
      max-width: 680px;
      margin: 0 auto;
      padding: var(--space-4) var(--space-4) var(--space-20);
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }
    .profile-cover {
      height: 140px;
      border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
      background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-secondary-light) 50%, var(--color-accent-mint-light) 100%);
      position: relative;
      overflow: hidden;
      border: 2px solid var(--color-border);
      border-bottom: none;
    }
    .profile-header-card {
      background-color: var(--color-surface);
      border: 2px solid var(--color-border);
      border-top: none;
      border-radius: 0 0 var(--radius-2xl) var(--radius-2xl);
      padding: 0 var(--space-6) var(--space-6);
      box-shadow: var(--shadow-sm);
      margin-top: -50px;
      position: relative;
    }
    .profile-avatar-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: var(--space-4);
    }
    .profile-avatar-wrap {
      border: 4px solid var(--color-surface);
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-md);
      background-color: var(--color-surface);
      position: relative;
    }
    .profile-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
      gap: var(--space-2);
      padding: var(--space-4) 0;
      border-top: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      margin-top: var(--space-4);
    }
    .profile-stat-val {
      font-family: var(--font-heading);
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--color-text);
    }
    .profile-stat-lbl {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }
  </style>

  <script type="module">
    import { api } from '/js/api.js';
    import { initApp, openEditProfileModal } from '/js/app.js';
    import { getStickerSvg } from '/js/stickers.js';
    import { toast, createAvatar, buildPostCard, buildUserRow, createSkeletonPost, createSkeletonUser, buildEmptyState } from '/js/ui.js';
    import { createHeartBurst, floatingLoop } from '/js/animations.js';

    let profileUser = null;
    let targetUsername = '';
    let currentTab = 'blooms';

    let postsPage = 1;
    let hasMorePosts = true;
    let isPostsLoading = false;
    let postsObserver = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      targetUsername = params.get('u');

      await initApp({
        activeTab: 'profile',
        protectedPage: false,
        onReady: async (currentUser) => {
          if (!targetUsername && currentUser) {
            targetUsername = currentUser.username;
          }
          if (!targetUsername) {
            window.location.href = '/auth.html';
            return;
          }
          loadProfileData();
        }
      });
    });

    async function loadProfileData() {
      const loadingEl = document.getElementById('profile-loading');
      const contentEl = document.getElementById('profile-content');
      const notFoundEl = document.getElementById('profile-not-found');

      try {
        const res = await api.getProfile(targetUsername);
        profileUser = res.user;

        document.title = `${profileUser.displayName || profileUser.username} (@${profileUser.username}) — Bloomly`;
        renderHeader();
        setupTabs();

        loadingEl.style.display = 'none';
        contentEl.style.display = 'flex';

        // Floating stickers on cover
        floatingLoop('.cover-sticker', { yOffset: 6, rotateOffset: 4 });

        // Load initial tab
        loadTabContent('blooms');
      } catch (err) {
        loadingEl.style.display = 'none';
        notFoundEl.style.display = 'block';
      }
    }

    function renderHeader() {
      const avSlot = document.getElementById('profile-avatar-slot');
      avSlot.innerHTML = '';
      avSlot.appendChild(
        createAvatar({
          avatar: profileUser.avatar,
          displayName: profileUser.displayName || profileUser.username,
          moodSticker: profileUser.moodSticker,
          size: 'xl'
        })
      );

      document.getElementById('profile-name').textContent = profileUser.displayName || profileUser.username;
      document.getElementById('profile-handle').textContent = `@${profileUser.username}`;

      const bioEl = document.getElementById('profile-bio');
      if (profileUser.bio) {
        bioEl.textContent = profileUser.bio;
        bioEl.style.display = 'block';
      } else {
        bioEl.style.display = 'none';
      }

      // Joined date
      const date = new Date(profileUser.createdAt);
      const joinedFormatted = date.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      document.getElementById('profile-joined').textContent = `Gardening since ${joinedFormatted}`;

      // Stats
      document.getElementById('stat-blooms').textContent = profileUser.postsCount || 0;
      document.getElementById('stat-followers').textContent = profileUser.followersCount || 0;
      document.getElementById('stat-following').textContent = profileUser.followingCount || 0;

      // Action button (Edit profile vs Plant/Unplant)
      const actionSlot = document.getElementById('profile-action-slot');
      actionSlot.innerHTML = '';

      if (profileUser.isMe) {
        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'btn btn-secondary btn-sm';
        editBtn.innerHTML = `
          <span style="width: 14px; height: 14px; display: inline-flex;">${getStickerSvg('sprout', { size: 14 })}</span>
          <span>Edit Profile</span>
        `;
        editBtn.addEventListener('click', () => {
          openEditProfileModal((updatedUser) => {
            profileUser = { ...profileUser, ...updatedUser };
            renderHeader();
          });
        });
        actionSlot.appendChild(editBtn);
      } else {
        const followBtn = document.createElement('button');
        followBtn.type = 'button';
        followBtn.className = `btn btn-sm ${profileUser.isFollowing ? 'btn-secondary' : 'btn-primary'}`;
        followBtn.innerHTML = `
          <span class="btn-icon-slot" style="width: 14px; height: 14px; display: inline-flex;">${getStickerSvg(profileUser.isFollowing ? 'flower' : 'sprout', { size: 14 })}</span>
          <span class="follow-text">${profileUser.isFollowing ? 'Planted' : 'Plant'}</span>
        `;
        followBtn.addEventListener('click', async () => {
          if (!window.currentUser) {
            window.location.href = `/auth.html?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
            return;
          }

          const isPlanted = profileUser.isFollowing;
          profileUser.isFollowing = !isPlanted;
          profileUser.followersCount = isPlanted ? Math.max(0, profileUser.followersCount - 1) : profileUser.followersCount + 1;

          // Optimistic
          document.getElementById('stat-followers').textContent = profileUser.followersCount;
          followBtn.className = `btn btn-sm ${profileUser.isFollowing ? 'btn-secondary' : 'btn-primary'}`;
          followBtn.querySelector('.follow-text').textContent = profileUser.isFollowing ? 'Planted' : 'Plant';
          followBtn.querySelector('.btn-icon-slot').innerHTML = getStickerSvg(profileUser.isFollowing ? 'flower' : 'sprout', { size: 14 });

          if (profileUser.isFollowing) {
            const rect = followBtn.getBoundingClientRect();
            createHeartBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 8);
          }

          try {
            const res = await api.toggleFollow(profileUser.id);
            profileUser.isFollowing = res.following;
            profileUser.followersCount = res.followersCount;
            document.getElementById('stat-followers').textContent = profileUser.followersCount;
          } catch (err) {
            // Roll back
            profileUser.isFollowing = isPlanted;
            profileUser.followersCount = isPlanted ? profileUser.followersCount + 1 : Math.max(0, profileUser.followersCount - 1);
            document.getElementById('stat-followers').textContent = profileUser.followersCount;
            followBtn.className = `btn btn-sm ${profileUser.isFollowing ? 'btn-secondary' : 'btn-primary'}`;
            followBtn.querySelector('.follow-text').textContent = profileUser.isFollowing ? 'Planted' : 'Plant';
            followBtn.querySelector('.btn-icon-slot').innerHTML = getStickerSvg(profileUser.isFollowing ? 'flower' : 'sprout', { size: 14 });
            toast(err.message || 'Could not update connection', 'error');
          }
        });
        actionSlot.appendChild(followBtn);
      }
    }

    function setupTabs() {
      const tabBlooms = document.getElementById('tab-user-blooms');
      const tabGarden = document.getElementById('tab-user-garden');
      const tabPlanted = document.getElementById('tab-user-planted');

      const allTabs = [tabBlooms, tabGarden, tabPlanted];

      tabBlooms.addEventListener('click', () => {
        allTabs.forEach(t => t.classList.remove('active'));
        tabBlooms.classList.add('active');
        loadTabContent('blooms');
      });

      tabGarden.addEventListener('click', () => {
        allTabs.forEach(t => t.classList.remove('active'));
        tabGarden.classList.add('active');
        loadTabContent('garden');
      });

      tabPlanted.addEventListener('click', () => {
        allTabs.forEach(t => t.classList.remove('active'));
        tabPlanted.classList.add('active');
        loadTabContent('planted');
      });
    }

    async function loadTabContent(tab) {
      currentTab = tab;
      const container = document.getElementById('tab-list-container');
      const sentinel = document.getElementById('profile-sentinel');
      const loadMoreBtn = document.getElementById('profile-load-more-btn');

      container.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: var(--space-4);">
          ${tab === 'blooms' ? createSkeletonPost().outerHTML : createSkeletonUser().outerHTML}
        </div>
      `;

      if (sentinel) sentinel.style.display = 'none';
      if (loadMoreBtn) loadMoreBtn.style.display = 'none';

      try {
        if (tab === 'blooms') {
          postsPage = 1;
          const res = await api.getUserPosts(targetUsername, 1, 10);
          const posts = res.items || [];
          hasMorePosts = res.hasMore;
          container.innerHTML = '';

          if (!posts.length) {
            container.appendChild(
              buildEmptyState({
                title: 'No blooms yet',
                subtitle: `${profileUser.displayName || profileUser.username} has not planted any moments in the garden yet.`,
                stickerName: 'sprout'
              })
            );
            return;
          }

          posts.forEach(post => {
            container.appendChild(
              buildPostCard(post, {
                onLike: async (p, btn) => {
                  const countEl = btn.querySelector('.like-count');
                  const isLiked = btn.classList.toggle('active');
                  const currentCount = parseInt(countEl.textContent, 10) || 0;
                  countEl.textContent = String(isLiked ? currentCount + 1 : Math.max(0, currentCount - 1));

                  if (isLiked) {
                    const rect = btn.getBoundingClientRect();
                    createHeartBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 8);
                  }

                  try {
                    const r = await api.toggleLike(p.id);
                    countEl.textContent = String(r.likesCount);
                    btn.classList.toggle('active', r.liked);
                  } catch (err) {
                    btn.classList.toggle('active', !isLiked);
                    countEl.textContent = String(currentCount);
                  }
                },
                onDelete: async (p, cardEl) => {
                  try {
                    await api.deletePost(p.id);
                    cardEl.remove();
                    profileUser.postsCount = Math.max(0, (profileUser.postsCount || 1) - 1);
                    document.getElementById('stat-blooms').textContent = profileUser.postsCount;
                    toast('Bloom removed', 'info');
                  } catch (err) {
                    toast(err.message || 'Could not delete bloom', 'error');
                  }
                }
              })
            );
          });

          if (hasMorePosts) {
            sentinel.style.display = 'block';
            if (postsObserver) postsObserver.disconnect();
            postsObserver = new IntersectionObserver(
              async (entries) => {
                if (entries[0].isIntersecting && hasMorePosts && !isPostsLoading) {
                  isPostsLoading = true;
                  postsPage++;
                  try {
                    const r = await api.getUserPosts(targetUsername, postsPage, 10);
                    hasMorePosts = r.hasMore;
                    (r.items || []).forEach(p => container.appendChild(buildPostCard(p)));
                    if (!hasMorePosts && postsObserver) postsObserver.disconnect();
                  } catch {} finally {
                    isPostsLoading = false;
                  }
                }
              },
              { rootMargin: '200px' }
            );
            postsObserver.observe(sentinel);
          }
        } else if (tab === 'garden') {
          const res = await api.getFollowers(targetUsername, 1, 20);
          const users = res.items || [];
          container.innerHTML = '';

          if (!users.length) {
            container.appendChild(
              buildEmptyState({
                title: 'Garden is empty',
                subtitle: 'No gardeners have planted with this profile yet.',
                stickerName: 'cloud'
              })
            );
            return;
          }

          users.forEach(u => container.appendChild(buildUserRow(u, { onFollow: handleListFollow })));
        } else if (tab === 'planted') {
          const res = await api.getFollowing(targetUsername, 1, 20);
          const users = res.items || [];
          container.innerHTML = '';

          if (!users.length) {
            container.appendChild(
              buildEmptyState({
                title: 'No gardens planted yet',
                subtitle: `${profileUser.displayName || profileUser.username} is not following any gardeners yet.`,
                stickerName: 'sprout'
              })
            );
            return;
          }

          users.forEach(u => container.appendChild(buildUserRow(u, { onFollow: handleListFollow })));
        }
      } catch (err) {
        container.innerHTML = `<div style="text-align: center; color: var(--color-danger); padding: var(--space-6);">Failed to load ${tab}</div>`;
      }
    }

    async function handleListFollow(user, btn) {
      if (!window.currentUser) {
        window.location.href = `/auth.html?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
        return;
      }

      const textSpan = btn.querySelector('.follow-text');
      const iconSlot = btn.querySelector('.btn-icon-slot');
      const isPlanted = textSpan.textContent === 'Planted';

      textSpan.textContent = isPlanted ? 'Plant' : 'Planted';
      btn.className = `btn btn-sm ${isPlanted ? 'btn-primary' : 'btn-secondary'}`;
      iconSlot.innerHTML = getStickerSvg(isPlanted ? 'sprout' : 'flower', { size: 14 });

      try {
        const res = await api.toggleFollow(user.id);
        textSpan.textContent = res.following ? 'Planted' : 'Plant';
        btn.className = `btn btn-sm ${res.following ? 'btn-secondary' : 'btn-primary'}`;
        iconSlot.innerHTML = getStickerSvg(res.following ? 'flower' : 'sprout', { size: 14 });
      } catch (err) {
        textSpan.textContent = isPlanted ? 'Planted' : 'Plant';
        btn.className = `btn btn-sm ${isPlanted ? 'btn-secondary' : 'btn-primary'}`;
        iconSlot.innerHTML = getStickerSvg(isPlanted ? 'flower' : 'sprout', { size: 14 });
        toast(err.message || 'Could not update connection', 'error');
      }
    }
  </script>
</head>
<body>

  <main id="main-content" class="profile-layout">
    <!-- Loading state -->
    <div id="profile-loading" style="display: flex; flex-direction: column; gap: var(--space-4);">
      <div class="skeleton" style="height: 140px; border-radius: var(--radius-2xl);"></div>
      <div class="card" style="height: 200px;"></div>
    </div>

    <!-- Not found state -->
    <div id="profile-not-found" style="display: none;">
      <div class="empty-state">
        <div style="width: 72px; height: 72px; margin-bottom: var(--space-3);" data-sticker="cloud"></div>
        <h2 class="empty-state-title">Gardener Not Found</h2>
        <p class="empty-state-desc">This corner of the garden seems uninhabited or does not exist.</p>
        <a href="/explore.html" class="btn btn-primary">Explore Other Gardeners</a>
      </div>
    </div>

    <!-- Active Profile Content -->
    <div id="profile-content" style="display: none; flex-direction: column; gap: var(--space-6);">
      <!-- Cover & Header Card -->
      <section aria-label="Gardener Profile Header">
        <div class="profile-cover">
          <div class="cover-sticker" style="position: absolute; top: 15px; left: 20px; width: 36px; height: 36px;" data-sticker="flower"></div>
          <div class="cover-sticker" style="position: absolute; top: 20px; right: 30px; width: 32px; height: 32px;" data-sticker="butterfly"></div>
          <div class="cover-sticker" style="position: absolute; bottom: 15px; right: 100px; width: 28px; height: 28px;" data-sticker="sparkle"></div>
        </div>

        <div class="profile-header-card">
          <div class="profile-avatar-row">
            <div class="profile-avatar-wrap" id="profile-avatar-slot"></div>
            <div id="profile-action-slot"></div>
          </div>

          <h1 id="profile-name" style="font-family: var(--font-heading); font-size: var(--text-2xl); color: var(--color-text); margin: 0 0 2px;"></h1>
          <div id="profile-handle" style="font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: var(--space-3);"></div>
          <p id="profile-bio" style="font-size: var(--text-sm); color: var(--color-text); line-height: 1.6; margin: 0 0 var(--space-3); white-space: pre-wrap;"></p>
          <div id="profile-joined" style="font-size: var(--text-xs); color: var(--color-text-light);"></div>

          <div class="profile-stats-grid">
            <div>
              <div class="profile-stat-val" id="stat-blooms">0</div>
              <div class="profile-stat-lbl">Blooms</div>
            </div>
            <div>
              <div class="profile-stat-val" id="stat-followers">0</div>
              <div class="profile-stat-lbl">Garden</div>
            </div>
            <div>
              <div class="profile-stat-val" id="stat-following">0</div>
              <div class="profile-stat-lbl">Planted</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Profile Tabs -->
      <div class="tabs-nav" style="width: 100%; display: flex;">
        <button type="button" class="tab-btn active" id="tab-user-blooms" style="flex: 1;">Blooms</button>
        <button type="button" class="tab-btn" id="tab-user-garden" style="flex: 1;">Garden</button>
        <button type="button" class="tab-btn" id="tab-user-planted" style="flex: 1;">Planted</button>
      </div>

      <!-- Tab Content Mount -->
      <div id="tab-list-container" style="display: flex; flex-direction: column; gap: var(--space-6);"></div>

      <!-- Sentinel & Load more -->
      <div id="profile-sentinel" class="load-more-sentinel" style="display: none;">
        <button type="button" class="btn btn-secondary btn-sm" id="profile-load-more-btn" style="display: none;">
          Load more
        </button>
      </div>
    </div>
  </main>

</body>
</html>
