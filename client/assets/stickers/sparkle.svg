<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="sparkle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#FF6F91" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#sparkle-shadow)">
    <!-- White Sticker Border -->
    <path d="M50 10 Q50 45 15 50 Q50 55 50 90 Q50 55 85 50 Q50 45 50 10 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
    <!-- Main Sparkle Body -->
    <path d="M50 12 Q50 45 17 50 Q50 55 50 88 Q50 55 83 50 Q50 45 50 12 Z"
          fill="#D9C8FF" stroke="#4A2C4F" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="50" cy="50" r="7" fill="#FFFFFF"/>
    <!-- Small Companion Dots -->
    <circle cx="78" cy="22" r="5" fill="#FFFFFF" stroke="#4A2C4F" stroke-width="2"/>
    <circle cx="78" cy="22" r="3.5" fill="#CDEFE2"/>
    <circle cx="22" cy="78" r="4" fill="#FFFFFF" stroke="#4A2C4F" stroke-width="2"/>
    <circle cx="22" cy="78" r="2.5" fill="#FFF0B3"/>
  </g>
</svg>

