<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="moon-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#FF6F91" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g filter="url(#moon-shadow)">
    <!-- White Sticker Border -->
    <path d="M60 12 C35 12 18 30 18 52 C18 74 35 90 58 90 C70 90 80 84 86 76 C65 74 50 58 50 38 C50 26 56 16 64 12 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
    <!-- Moon Body -->
    <path d="M60 14 C36 14 20 31 20 52 C20 73 36 88 58 88 C69 88 78 83 83 75 C64 72 50 57 50 38 C50 27 55 18 63 14 Z"
          fill="#FFF0B3" stroke="#4A2C4F" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Sleepy Eye and Cheek -->
    <path d="M34 50 Q39 46 44 50" fill="none" stroke="#4A2C4F" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="36" cy="56" r="3.5" fill="#FFCDB2"/>
    <circle cx="28" cy="38" r="2" fill="#FFFFFF"/>
    <!-- Tiny Star Decor -->
    <path d="M72 32 L74 38 L80 38 L75 42 L77 48 L72 44 L67 48 L69 42 L64 38 L70 38 Z"
          fill="#D9C8FF" stroke="#4A2C4F" stroke-width="2"/>
