# Keepsake - Render Blueprint (Persistent Disk Mode)
# Deploys on Render's Starter tier with a persistent SSD disk for permanent media storage.
services:
  - type: web
    name: keepsake
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: keepsake-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /var/data/storage
      # To load the demo persona dataset for your first look, change DEMO_MODE and SEED_DEMO_ON_BOOT to "true"
      - key: DEMO_MODE
        value: "false"
      - key: SEED_DEMO_ON_BOOT
        value: "false"
      - key: RECONCILE_STORAGE_ON_BOOT
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_VIDEO_MB
        value: "150"
      - key: MAX_VIDEO_SECONDS
        value: "180"
      - key: USER_QUOTA_MB
        value: "500"
      - key: MAX_IMAGE_MB
        value: "20"
      - key: VIDEO_CONCURRENCY
        value: "1"

